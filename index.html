<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まるこよみ">
<meta name="theme-color" content="#F5F4F9">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>まるこよみ 妊活手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, cycle ring as the home hero, fixed bottom tab bar */
:root{
  --bg:#F5F4F9; --surface:#FFFFFF; --line:#E3DFEB; --fg:#28222F; --muted:#6D6578;
  --plum:#5B3F7A; --plum-soft:#ECE4F5;
  --rose:#D4435C; --rose-soft:#F8DCE1;
  --teal:#1C8378; --teal-soft:#D2ECE8;
  --amber:#B8730F; --amber-soft:#F8E8CC;
  --grid:#EFECF4; --wk:#F7F5FA; --sat:#2F6DB0; --hl:#FAD9E6; --heart:#DE4F86;
  --good:#2E8A4F; --good-soft:#DCF0E2; --neutral:#7C748A; --neutral-soft:#ECEAF0; --bad:#D12E6B; --bad-soft:#FBDCE8;
  --period:#3566D6; --period-soft:#DCE6FA; --fert:#D99A00; --fert-soft:#FFF0C4; --ovu:#EE7417; --ovu-soft:#FDE2CC;
  --on-color:#FFFFFF;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121A; --surface:#201B27; --line:#352E3F; --fg:#EFEBF4; --muted:#A79FB2;
  --plum:#BDA0DE; --plum-soft:#2F2540;
  --rose:#F07087; --rose-soft:#46222C;
  --teal:#52C3B4; --teal-soft:#153833;
  --amber:#E9A746; --amber-soft:#3A2B12;
  --grid:#2A2432; --wk:#1C1823; --sat:#7EAEE6; --hl:#4A2238; --heart:#F48BB0;
  --good:#62C985; --good-soft:#173322; --neutral:#ABA3B6; --neutral-soft:#2B2633; --bad:#F26D9E; --bad-soft:#44172A;
  --period:#7FA3F5; --period-soft:#1C2944; --fert:#F2C94C; --fert-soft:#3A3010; --ovu:#FF9A4A; --ovu-soft:#40260F;
  --on-color:#15121A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15121A; --surface:#201B27; --line:#352E3F; --fg:#EFEBF4; --muted:#A79FB2;
  --plum:#BDA0DE; --plum-soft:#2F2540;
  --rose:#F07087; --rose-soft:#46222C;
  --teal:#52C3B4; --teal-soft:#153833;
  --amber:#E9A746; --amber-soft:#3A2B12;
  --grid:#2A2432; --wk:#1C1823; --sat:#7EAEE6; --hl:#4A2238; --heart:#F48BB0;
  --good:#62C985; --good-soft:#173322; --neutral:#ABA3B6; --neutral-soft:#2B2633; --bad:#F26D9E; --bad-soft:#44172A;
  --period:#7FA3F5; --period-soft:#1C2944; --fert:#F2C94C; --fert-soft:#3A3010; --ovu:#FF9A4A; --ovu-soft:#40260F;
  --on-color:#15121A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:20px;letter-spacing:.02em}
h2{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.date-now{font-size:13px;color:var(--muted)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--plum-soft);font-size:13px}
.banner.warn{background:var(--rose-soft)}
.banner button{border:0;background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
/* ring */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:8px}
.ring{width:100%;max-width:280px;aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em}
.ring-center .big{font-family:var(--font-display);font-size:56px;line-height:1;font-weight:700}
.ring-center .unit{font-size:13px;color:var(--muted)}
.seg{fill:none;stroke-width:18}
.seg-normal{stroke:var(--line)}
.seg-period{stroke:var(--period)}
.seg-fertile{stroke:var(--fert-soft)}
.seg-ov{stroke:var(--ovu)}
.seg-future{opacity:.55}
.status{text-align:center;display:flex;flex-direction:column;gap:2px}
.status .main{font-family:var(--font-display);font-size:22px;font-weight:700}
.status .sub{color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.period{background:var(--period)}.sw.pred{border:1.5px dashed var(--period)}.sw.fertile{background:var(--fert-soft);border:1px solid var(--fert)}.sw.ov{background:var(--ovu)}.sw.timing{background:var(--plum);border-radius:50%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.hero-date{align-self:stretch;text-align:center;font-family:var(--font-display);font-size:19px;font-weight:700}
.strip{align-self:stretch;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.sd .w{font-size:11px;color:var(--muted)}
.sd .n{position:relative;font-size:16px;font-weight:700;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.sd .m{display:flex;gap:1px;justify-content:center;min-height:13px}
.sd.period .n{background:var(--period);color:var(--on-color)}
.sd.pred .n{box-shadow:inset 0 0 0 1.5px var(--period);color:var(--period)}
.sd.fertile .n{background:var(--fert-soft)}
.sd.ov .n{background:var(--ovu);color:var(--on-color)}
.sd.today{background:var(--plum-soft)}
.sd.today .w{color:var(--plum);font-weight:700}
.fact .v{font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1.3}
.fact .d{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:600;font-size:14px;text-align:center}
.btn.primary{background:var(--period);border-color:var(--period);color:var(--on-color)}
.btn.on{background:var(--plum);border-color:var(--plum);color:var(--on-color)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn.danger.armed{background:var(--rose);color:var(--on-color)}
.hint{font-size:13px;color:var(--muted);background:var(--bg);padding:10px 12px;border-radius:10px}
.hint strong{color:var(--teal)}
/* bbt */
.bbt-row{display:flex;gap:8px;align-items:center}
.bbt-row input{flex:1;min-width:0}
input[type=number],input[type=text],input[type=time]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head button{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{position:relative;height:64px;min-width:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;display:block;text-align:left;padding:5px 5px 0;font-variant-numeric:tabular-nums;color:var(--fg)}
.day.out{pointer-events:none}
.day .dn{font-size:14px;line-height:1}
.day.sun .dn{color:var(--rose)}.day.sat .dn{color:var(--sat)}
.day.today{background:var(--amber-soft)}
.day.today .dn{font-weight:700}
.day.sel{box-shadow:inset 0 0 0 2px var(--plum)}
.day:nth-child(7n+1){border-left:1px solid var(--line)}
.wd{border-bottom:1px solid var(--line)}
.day .tops{position:absolute;top:6px;right:5px;display:flex;gap:2px}
.tdot{width:7px;height:7px;border-radius:50%;display:block}
.tdot.m-good{background:var(--good)}.tdot.m-neutral{background:var(--neutral)}.tdot.m-bad{background:var(--bad)}.tdot.lh{background:var(--amber)}
.day .dic{position:absolute;right:3px;bottom:8px;display:flex;gap:1px;align-items:center}
.stripe{position:absolute;left:0;right:0;bottom:1px;height:3px}
.s-period{background:var(--period)}
.s-pred{background:repeating-linear-gradient(90deg,var(--period) 0 4px,transparent 4px 7px)}
.s-fert{background:var(--fert)}
.ic{display:block;flex:none}
.ic.line path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.ic.fill path{fill:currentColor}
.ic.egg path{fill:var(--ovu-soft);stroke:var(--ovu);stroke-width:1.8}
.k-period{color:var(--period)}.k-fert{color:var(--fert)}.k-ovu{color:var(--ovu)}.k-heart{color:var(--heart)}
.legend .ic{display:inline-block}
.wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.wd:first-child{color:var(--rose)}
.wd:nth-child(7){color:var(--sat)}
.sw.rec{border:2px dotted var(--plum);border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--neutral);--cs:var(--neutral-soft);border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip.good{--c:var(--good);--cs:var(--good-soft)}.chip.bad{--c:var(--bad);--cs:var(--bad-soft)}
.chip[aria-pressed="true"]{background:var(--cs);border-color:var(--c);color:var(--c);font-weight:700}
.cat-legend{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.cat-legend span{display:inline-flex;align-items:center;gap:4px}
.cat-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rec-days{display:flex;flex-direction:column;gap:2px;margin-top:4px;color:var(--fg);font-variant-numeric:tabular-nums}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg-ctl button{border:0;background:var(--surface);padding:10px 4px;font-size:14px}
.seg-ctl button+button{border-left:1px solid var(--line)}
.seg-ctl button[aria-pressed="true"]{background:var(--plum);color:var(--on-color);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em}
/* meds */
.med{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.med .t{font-family:var(--font-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.med .n{font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.03em}
.pill.taken{background:var(--teal-soft);color:var(--teal)}
.pill.missed{background:var(--rose-soft);color:var(--rose)}
.pill.wait{background:var(--plum-soft);color:var(--plum)}
.check{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check.done{background:var(--teal);border-color:var(--teal);color:var(--on-color)}
.check.missed{border-color:var(--rose)}
.add-row{display:grid;grid-template-columns:1fr 112px;gap:8px}
.manage{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.manage button{border:0;background:transparent;color:var(--rose);font-size:13px;padding:6px}
.hist{overflow-x:auto}
.hist table{border-collapse:collapse;width:100%;font-size:12px}
.hist th,.hist td{padding:6px 2px;text-align:center;font-variant-numeric:tabular-nums}
.hist th:first-child,.hist td:first-child{text-align:left;max-width:110px;overflow-wrap:anywhere}
.mk{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--line)}
.mk.ok{background:var(--teal)}
.mk.ng{background:var(--rose-soft);box-shadow:inset 0 0 0 1.5px var(--rose)}
/* settings */
.set-row{display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center}
.cycles{display:flex;flex-wrap:wrap;gap:6px}
.cycles span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);line-height:1.7}
/* gantt */
.gpanel{padding:16px 0 0;overflow:hidden}
.gpanel .section-head{padding-inline:16px;flex-wrap:wrap}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.gg{display:grid;width:max-content}
.gl{position:sticky;left:0;z-index:4;background:var(--surface);font-size:10px;display:flex;align-items:center;gap:3px;padding-left:5px;height:20px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gc{height:20px;display:flex;align-items:center;justify-content:center;box-shadow:inset -1px 0 var(--grid);min-width:0;overflow:visible}
.gc.wk{background:var(--wk)}
.gc.hl{background:var(--hl)}
.gc.tcol{box-shadow:inset 1.5px 0 var(--plum),inset -1.5px 0 var(--plum)}
.gm{font-size:10px;font-weight:700;white-space:nowrap;margin-right:auto;padding-left:2px;position:relative;z-index:1}
.gc:has(.gm){justify-content:flex-start}
.gdate-l,.gdc{height:30px;border-bottom:1px solid var(--line)}
.gd{border:0;background:transparent;padding:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible;font-variant-numeric:tabular-nums}
.gd b{font-size:clamp(5px,calc(var(--cw) * 1.2),12px);line-height:1;position:relative;z-index:1}
.gd b.vt{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.08em}
.gd small{font-size:8px;color:var(--muted);line-height:1.1}
.gc .ic{width:clamp(6px,calc(var(--cw) + 2px),14px);height:clamp(6px,calc(var(--cw) + 2px),14px)}
.gbbt svg{width:100%;height:170px}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.zoom span{min-width:40px;text-align:center;font-size:13px;color:var(--muted)}
.gscroll{touch-action:pan-x pan-y}
.gd.sun b{color:var(--rose)}
.gd.sat b{color:var(--sat)}
.gd.now b{background:var(--plum);color:var(--on-color);border-radius:4px;padding:2px 1px;z-index:2}
.gh{height:16px;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.06em;border-top:1px solid var(--line)}
.ghc{height:16px;border-top:1px solid var(--line)}
.bar{display:block;flex:1 1 auto;height:10px}
.bar.s{margin-left:1px;border-top-left-radius:5px;border-bottom-left-radius:5px}
.bar.e{margin-right:1px;border-top-right-radius:5px;border-bottom-right-radius:5px}
.b-period{background:var(--period)}
.b-fert{background:var(--fert-soft);box-shadow:inset 0 1px var(--fert),inset 0 -1px var(--fert)}
.b-pred{height:9px;border-top:1px dashed var(--period);border-bottom:1px dashed var(--period)}
.b-pred.s{border-left:1px dashed var(--period)}.b-pred.e{border-right:1px dashed var(--period)}
.gemo{font-size:11px;line-height:1;position:relative;z-index:1}
.gdot{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.g-tim{background:var(--plum);width:7px;height:7px}
.gdot.c-good{background:var(--good)}.gdot.c-neutral{background:var(--neutral)}.gdot.c-bad{background:var(--bad)}
.gk{width:6px;height:6px;border-radius:50%;flex:none}
.gk.good{background:var(--good)}.gk.neutral{background:var(--neutral)}.gk.bad{background:var(--bad)}
.gmood{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--on-color)}
.gmood.good{background:var(--good)}.gmood.neutral{background:var(--neutral)}.gmood.bad{background:var(--bad)}
.gbbt-l{height:170px;align-items:stretch;padding-left:0}
.gbbt{height:170px}
.gbbt svg{display:block}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--plum);font-weight:700}
.nav svg{width:24px;height:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);transition:opacity .2s}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M13 3 A10 10 0 0 1 22.5 10" fill="none" stroke="var(--period)" stroke-width="4"/><path d="M21 18 A10 10 0 0 1 16 22.5" fill="none" stroke="var(--teal)" stroke-width="4"/></svg>
      <h1>まるこよみ</h1>
    </div>
    <div class="date-now num" id="dateNow"></div>
  </header>
  <div id="sampleBanner" class="banner" hidden>
    <span>サンプルの記録を表示しています</span>
    <button type="button" id="clearSample">消去して自分の記録を始める</button>
  </div>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="メニュー">
  <div class="nav-in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="2" fill="currentColor"/></svg>今日</button>
    <button type="button" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>カレンダー</button>
    <button type="button" data-tab="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 4v16h17"/><path d="M6.5 15l4-5 3.5 3 5-6.5"/></svg>グラフ</button>
    <button type="button" data-tab="meds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.3 8.2l5.4 7.6"/></svg>お薬</button>
    <button type="button" data-tab="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='marukoyomi-v1';
const WD=['日','月','火','水','木','金','土'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>ymd(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
const mds=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdj=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sample(){
  const t=today(), d=blank(); d.sample=true; d.sampleVer=4;
  let seed=20261107; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const cyc=[{s:-69,len:5,ov:-55,next:-41},{s:-41,len:6,ov:-26,next:-12},{s:-12,len:5,ov:3,next:17}];
  cyc.forEach(c=>{for(let i=0;i<c.len;i++)if(c.s+i<=0)d.period[add(t,c.s+i)]=true});
  d.meds=[{id:'m1',name:'葉酸サプリ',time:'08:00'},{id:'m2',name:'処方薬（例）',time:'21:00'}];
  for(let o=-69;o<=0;o++){
    const day=add(t,o), c=cyc.filter(x=>x.s<=o).pop();
    const inPeriod=o<c.s+c.len, high=o>c.ov, pms=c.next-o<=4, fert=o>=c.ov-5&&o<=c.ov+1;
    {let v=(high?36.76:36.32)+(rnd()-.5)*.2;if(o===c.ov)v-=.12;if(o===c.ov+1)v+=.18;d.bbt[day]=Math.round(v*100)/100}
    d.mood[day]=(inPeriod||pms)?pick(['irritated','lonely','normal','irritated']):pick(['happy','fun','normal','happy','fun','normal']);
    const cs=[];
    if(fert&&rnd()<.8)cs.push('discharge');
    if(rnd()<.6)cs.push('poop');
    if(inPeriod&&o-c.s<2&&rnd()<.85)cs.push('cramp');
    if(rnd()<(high?.4:.2))cs.push('sleepy');
    if(rnd()<(pms?.4:.1))cs.push('headache');
    if((inPeriod||pms)&&rnd()<.5)cs.push('backache');
    if((pms||inPeriod)&&rnd()<.35)cs.push('skin');
    if(rnd()<(pms?.5:.2))cs.push('appetite');
    if(cs.length)d.cond[day]=cs;
    const log={};
    if(rnd()>.06)log.m1='08:'+pad(Math.floor(rnd()*20));
    if(o<0&&rnd()>.1)log.m2='21:'+pad(Math.floor(rnd()*15));
    if(Object.keys(log).length)d.medLog[day]=log;
  }
  [-59,-57,-55,-48,-30,-28,-26,-20,-1].forEach(o=>d.timing[add(t,o)]=true);
  [[-58,'neg'],[-57,'neg'],[-56,'pos'],[-55,'neg'],[-29,'neg'],[-28,'neg'],[-27,'pos'],[-26,'neg'],[-2,'neg'],[-1,'neg'],[0,'neg']].forEach(([o,v])=>d.lh[add(t,o)]=v);
  return d;
}
function blank(){return{v:1,sample:false,settings:{cycle:28,period:5,luteal:14},period:{},timing:{},bbt:{},lh:{},meds:[],medLog:{},mood:{},cond:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1)return d}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load()||sample();
if(S.sample&&S.sampleVer!==4)S=sample();
S.mood=S.mood||{}; S.cond=S.cond||{};
const MOODS=[['happy','幸せ','good'],['fun','楽しい','good'],['irritated','イライラ','bad'],['lonely','寂しい','bad'],['normal','普通','neutral']];
const CONDS=[['discharge','おりもの','good'],['poop','うんち','good'],['cramp','腹痛','bad'],['sleepy','眠気','bad'],['headache','頭痛','bad'],['backache','腰痛','bad'],['skin','肌荒れ','bad'],['appetite','食欲','neutral']];
const moodCat=k=>(MOODS.find(m=>m[0]===k)||[])[2];
function moodCond(day){
  const cs=S.cond[day]||[];
  return '<div class="field"><label>気分（1つ選択）</label><div class="chips">'
   +MOODS.map(([k,l,g])=>'<button type="button" class="chip '+g+'" data-mood="'+k+'" data-mday="'+day+'" aria-pressed="'+(S.mood[day]===k)+'">'+l+'</button>').join('')+'</div></div>'
   +'<div class="field"><label>体調（複数選択可）</label><div class="chips">'
   +CONDS.map(([k,l,g])=>'<button type="button" class="chip '+g+'" data-cond="'+k+'" data-cday="'+day+'" aria-pressed="'+cs.includes(k)+'">'+l+'</button>').join('')+'</div></div>'
   +'<div class="cat-legend"><span><i style="background:var(--good)"></i>良い</span><span><i style="background:var(--neutral)"></i>普通</span><span><i style="background:var(--bad)"></i>悪い</span></div>';
}
let tab='today', sel=today(), vm=null, armed=false;

function calc(){
  const t=today(), st=S.settings;
  const starts=Object.keys(S.period).filter(k=>S.period[k]).sort().filter(d=>!S.period[add(d,-1)]);
  const cycles=[];
  for(let i=1;i<starts.length;i++){const c=diff(starts[i],starts[i-1]);if(c>=18&&c<=50)cycles.push(c)}
  const rec=cycles.slice(-6);
  const avg=rec.length?Math.round(rec.reduce((a,b)=>a+b,0)/rec.length):st.cycle;
  const past=starts.filter(d=>d<=t);
  const last=past[past.length-1]||null;
  const map={}, recT={};
  const mark=(nextStart)=>{const ov=add(nextStart,-st.luteal);recT[ov]=recT[add(ov,-2)]=recT[add(ov,-4)]=true;for(let i=-5;i<=1;i++){const d=add(ov,i);if(!map[d])map[d]=(i===0?'ov':'fertile')}if(map[ov]!=='ov')map[ov]='ov';return ov};
  // past cycles
  for(let i=0;i<starts.length-1;i++)mark(starts[i+1]);
  if(!last)return{avg,cycles,last:null,map,starts,rec:recT};
  let next=add(last,avg);
  const curOv=mark(next);
  const late=t>next&&!S.period[t]?diff(t,next):0;
  // predictions
  let s=late?add(t,1):next;
  if(late)s=null;
  if(s){for(let k=0;k<6;k++){for(let i=0;i<st.period;i++){const d=add(s,i);if(!S.period[d]&&d>t)map[d]='pred'}const e=add(s,avg);mark(e);s=e}}
  const cycleDay=diff(t,last)+1;
  const fStart=add(curOv,-5), fEnd=add(curOv,1);
  const nextOv=t<=fEnd?curOv:add(add(next,avg),-st.luteal);
  return{avg,cycles,last,map,starts,next,curOv,nextOv,fStart,fEnd,cycleDay,late,rec:recT};
}

function statusText(c){
  const t=today();
  if(!c.last)return{main:'まだ記録がありません',sub:'生理が始まった日を記録すると予測が始まります'};
  if(c.late>0)return{main:'予定日を'+c.late+'日過ぎています',sub:'次の生理予定日は '+md(c.next)+' でした'};
  if(S.period[t]){let n=1;while(S.period[add(t,-n)])n++;return{main:'生理 '+n+'日目',sub:'次の妊娠しやすい時期は '+md(c.fStart)+' から'}}
  if(t>=c.fStart&&t<=c.fEnd){
    if(t===c.curOv)return{main:'今日は排卵予定日',sub:'妊娠しやすい時期は '+md(c.fEnd)+' まで'};
    if(t<c.curOv)return{main:'妊娠しやすい時期',sub:'排卵予定日まであと '+diff(c.curOv,t)+'日'};
    return{main:'妊娠しやすい時期',sub:'排卵予定日の翌日です'};
  }
  if(t<c.fStart)return{main:'妊娠しやすい時期まであと '+diff(c.fStart,t)+'日',sub:'排卵予定日は '+md(c.curOv)};
  return{main:'次の生理まであと '+diff(c.next,t)+'日',sub:'生理予定日は '+md(c.next)};
}

function ringSVG(c){
  const t=today(), total=Math.max(c.avg,c.cycleDay), cx=140,cy=140,r=112;
  const gap=total>40?.6:1.3;
  const pt=a=>{const rad=a*Math.PI/180;return[(cx+r*Math.cos(rad)).toFixed(2),(cy+r*Math.sin(rad)).toFixed(2)]};
  let out='';
  for(let i=1;i<=total;i++){
    const a0=-90+(i-1)*360/total+gap/2, a1=-90+i*360/total-gap/2;
    const d=add(c.last,i-1);
    let cls='seg-normal';
    if(S.period[d])cls='seg-period';
    else if(c.map[d]==='ov')cls='seg-ov';
    else if(c.map[d]==='fertile')cls='seg-fertile';
    const fut=d>t?' seg-future':'';
    const [x0,y0]=pt(a0),[x1,y1]=pt(a1);
    out+='<path class="seg '+cls+fut+'" d="M'+x0+' '+y0+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+x1+' '+y1+'"/>';
  }
  const am=-90+(c.cycleDay-.5)*360/total;const[mx,my]=pt(am);
  out+='<circle cx="'+mx+'" cy="'+my+'" r="12" fill="var(--fg)" stroke="var(--surface)" stroke-width="4"/>';
  const [lx,ly]=pt(-90+gap);
  return '<svg viewBox="0 0 280 280" role="img" aria-label="周期'+c.cycleDay+'日目、平均周期'+c.avg+'日">'+out+'</svg>';
}

function bbtChart(c){
  if(!c.last)return'';
  const days=Math.max(c.avg,c.cycleDay);
  const pts=[];
  for(let i=1;i<=days;i++){const d=add(c.last,i-1);if(S.bbt[d]!=null)pts.push([i,S.bbt[d]])}
  const W=320,H=140,L=34,R=8,T=10,B=24;
  const vals=pts.map(p=>p[1]);
  const lo=Math.min(36.0,...vals.map(v=>Math.floor((v-.1)*10)/10)), hi=Math.max(37.0,...vals.map(v=>Math.ceil((v+.1)*10)/10));
  const x=i=>L+(i-1)*(W-L-R)/Math.max(days-1,1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g='';
  const fs=diff(c.fStart,c.last)+1, fe=diff(c.fEnd,c.last)+1;
  if(fe>=1)g+='<rect x="'+x(Math.max(fs,1)).toFixed(1)+'" y="'+T+'" width="'+(x(fe)-x(Math.max(fs,1))).toFixed(1)+'" height="'+(H-T-B)+'" fill="var(--fert-soft)"/>';
  for(let v=Math.ceil(lo*2)/2;v<=hi+1e-9;v+=.5){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v.toFixed(1)+'</text>'}
  [1,7,14,21,28,35,42].filter(i=>i<=days).forEach(i=>{g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+mds(add(c.last,i-1))+'</text>'});
  const ci=c.cycleDay;g+='<line x1="'+x(ci).toFixed(1)+'" x2="'+x(ci).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--plum)" stroke-dasharray="3 3"/>';
  if(pts.length>1)g+='<polyline fill="none" stroke="var(--plum)" stroke-width="2" stroke-linejoin="round" points="'+pts.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')+'"/>';
  pts.forEach((p,k)=>{g+='<circle cx="'+x(p[0]).toFixed(1)+'" cy="'+y(p[1]).toFixed(1)+'" r="'+(k===pts.length-1?4:2.5)+'" fill="var(--plum)"/>'});
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="今周期の基礎体温">'+g+'</svg></div>';
}

function medState(m,day){
  const log=(S.medLog[day]||{})[m.id];
  if(log)return{k:'taken',txt:log+' 服用'};
  if(day<today()||(day===today()&&nowHM()>=m.time))return{k:'missed',txt:'飲み忘れ'};
  return{k:'wait',txt:'予定'};
}
function medRows(full){
  const t=today();
  if(!S.meds.length)return'<p class="muted small">お薬が登録されていません。「お薬」タブから追加できます。</p>';
  return S.meds.slice().sort((a,b)=>a.time<b.time?-1:1).map(m=>{const s=medState(m,t);
    return '<div class="med"><div class="t">'+esc(m.time)+'</div><div><div class="n">'+esc(m.name)+'</div><span class="pill '+s.k+'">'+s.txt+'</span></div><button type="button" class="check '+(s.k==='taken'?'done':s.k==='missed'?'missed':'')+'" data-med="'+m.id+'" aria-label="'+esc(m.name)+'を'+(s.k==='taken'?'未服用に戻す':'飲んだ')+'">'+(s.k==='taken'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<span class="small">飲んだ</span>')+'</button></div>'}).join('');
}

function weekStrip(c){
  const t=today();let h='';
  for(let i=-2;i<=4;i++){
    const d=add(t,i),p=parse(d);let cls='sd';
    if(S.period[d])cls+=' period';else if(c.map[d])cls+=' '+c.map[d];
    if(d===t)cls+=' today';
    h+='<button type="button" class="'+cls+'" data-goday="'+d+'" aria-label="'+mdj(d)+'"><span class="w">'+(d===t?'今日':WD[p.getDay()])+'</span><span class="n">'+p.getDate()+'</span><span class="m">'+dayIcons(d,c,12)+'</span></button>';
  }
  return '<div class="strip">'+h+'</div>';
}

function viewToday(){
  const c=calc(), t=today(), st=statusText(c);
  const missed=S.meds.filter(m=>medState(m,t).k==='missed');
  let h='';
  if(missed.length)h+='<div class="banner warn"><span>飲み忘れ：'+missed.map(m=>esc(m.name)+'（'+m.time+'）').join('、')+'</span><button type="button" data-go="meds">確認する</button></div>';
  h+='<section class="panel hero"><div class="hero-date">'+mdj(t)+'</div>';
  if(c.last){
    h+='<div class="ring">'+ringSVG(c)+'<div class="ring-center"><div class="lbl">周期</div><div class="big num">'+c.cycleDay+'</div><div class="unit">日目</div></div></div>';
  }
  h+='<div class="status"><div class="main">'+st.main+'</div><div class="sub">'+st.sub+'</div></div>';
  h+=weekStrip(c);
  if(c.last)h+='<div class="legend"><span><i class="sw period"></i>生理</span><span><i class="sw fertile"></i>妊娠しやすい時期</span><span>'+ic('egg','egg','ovu',13)+'排卵予定日</span><span>'+ic('heart','line','heart',13)+'タイミング推奨</span></div>';
  h+='</section>';
  if(c.last){
    h+='<div class="facts"><div class="fact"><span class="k">次の生理</span><span class="v num">'+md(c.next)+'</span><span class="d">'+(c.late?c.late+'日経過':'あと'+diff(c.next,t)+'日')+'</span></div>'
     +'<div class="fact"><span class="k">排卵予定日</span><span class="v num">'+md(c.nextOv)+'</span><span class="d">'+(c.nextOv===t?'今日':c.nextOv>t?'あと'+diff(c.nextOv,t)+'日':md(c.nextOv))+'</span></div>'
     +'<div class="fact"><span class="k">平均周期</span><span class="v num">'+c.avg+'日</span><span class="d">'+(c.cycles.length?'直近'+Math.min(c.cycles.length,6)+'周期':'初期値')+'</span></div></div>';
  }
  // actions
  const yP=S.period[add(t,-1)], tP=S.period[t];
  let pBtn;
  if(tP)pBtn='<button type="button" class="btn on" data-act="period">生理を記録済み（取消）</button>';
  else if(yP)pBtn='<button type="button" class="btn primary" data-act="period">今日も生理が続いている</button>';
  else pBtn='<button type="button" class="btn primary" data-act="period">今日 生理が来た</button>';
  h+='<section class="panel"><div class="section-head"><h2>今日の記録</h2><span class="small muted">'+mdj(t)+'</span></div><div class="actions">'+pBtn
    +'<button type="button" class="btn '+(S.timing[t]?'on':'')+'" data-act="timing">'+(S.timing[t]?'タイミング記録済み':'タイミングを記録')+'</button></div>';
  if(c.last&&!c.late){
    const base=t<=c.curOv?c.curOv:add(add(c.next,c.avg),-S.settings.luteal);
    const list=[[add(base,-4),'排卵予定日の4日前'],[add(base,-2),'排卵予定日の2日前'],[base,'排卵予定日']];
    h+='<div class="hint"><strong>'+(c.rec[t]?'今日はタイミング推奨日です':'タイミング推奨日')+'</strong><div class="rec-days">'
      +list.map(([d,l])=>'<span>'+mdj(d)+'　<span class="muted">'+l+(d===t?'・今日':'')+'</span></span>').join('')+'</div></div>';
  }
  h+='<div class="field"><label for="bbtToday">今日の基礎体温（℃）</label><div class="bbt-row"><input id="bbtToday" type="number" inputmode="decimal" step="0.01" min="34" max="42" placeholder="36.50" value="'+(S.bbt[t]!=null?S.bbt[t].toFixed(2):'')+'"><button type="button" class="btn" data-act="bbt" style="flex:none">保存</button></div></div>';
  h+='</section>';
  h+='<section class="panel"><h2>今日の気分・体調</h2>'+moodCond(t)+'</section>';
  h+='<section class="panel"><div class="section-head"><h2>今日のお薬</h2><button type="button" class="btn ghost small" data-go="meds" style="padding:4px 8px;border:0">管理</button></div>'+medRows()+'</section>';
  if(c.last)h+='<section class="panel"><div class="section-head"><h2>基礎体温</h2><span class="small muted">今周期</span></div>'+bbtChart(c)+'</section>';
  return h;
}

function viewCal(){
  const c=calc(), t=today();
  if(!vm){const d=parse(t);vm=[d.getFullYear(),d.getMonth()]}
  const [Y,M]=vm, first=new Date(Y,M,1,12), dim=new Date(Y,M+1,0).getDate();
  let g='';WD.forEach(w=>g+='<div class="wd">'+w+'</div>');
  for(let i=0;i<first.getDay();i++)g+='<div class="day out" aria-hidden="true"></div>';
  for(let dd=1;dd<=dim;dd++){
    const d=Y+'-'+pad(M+1)+'-'+pad(dd);
    const w=parse(d).getDay();
    let cls='day'+(w===0?' sun':w===6?' sat':'');
    if(d===t)cls+=' today'; if(d===sel)cls+=' sel';
    const stripe=S.period[d]?'s-period':c.map[d]==='pred'?'s-pred':(c.map[d]==='fertile'||c.map[d]==='ov')?'s-fert':'';
    let tops='';if(S.mood[d])tops+='<i class="tdot m-'+moodCat(S.mood[d])+'"></i>';if(S.lh[d]==='pos')tops+='<i class="tdot lh"></i>';
    g+='<button type="button" class="'+cls+'" data-day="'+d+'" aria-label="'+mdj(d)+'"><span class="dn">'+dd+'</span>'+(tops?'<span class="tops">'+tops+'</span>':'')+'<span class="dic">'+dayIcons(d,c,15)+'</span>'+(stripe?'<i class="stripe '+stripe+'"></i>':'')+'</button>';
  }
  const tail=(7-(first.getDay()+dim)%7)%7;for(let i=0;i<tail;i++)g+='<div class="day out" aria-hidden="true"></div>';
  let h='<section class="panel"><div class="cal-head"><button type="button" data-mv="-1" aria-label="前の月">‹</button><h2 class="num">'+Y+'年'+(M+1)+'月</h2><button type="button" data-mv="1" aria-label="次の月">›</button></div><div class="grid7">'+g+'</div>'

  // detail

  h+='<section class="panel"><div class="section-head"><h2>'+mdj(sel)+'</h2><span class="small muted">'+tag+'</span></div>';

  else{
    h+='<div class="detail-grid"><button type="button" class="btn '+(S.period[sel]?'on':'')+'" data-dact="period" aria-pressed="'+!!S.period[sel]+'">生理'+(S.period[sel]?'あり':'を記録')+'</button>'
     +'<button type="button" class="btn '+(S.timing[sel]?'on':'')+'" data-dact="timing" aria-pressed="'+!!S.timing[sel]+'">タイミング'+(S.timing[sel]?'あり':'を記録')+'</button></div>'
     +'<div class="field"><label>排卵検査薬</label><div class="seg-ctl">'
     +[['','未使用'],['neg','陰性'],['pos','陽性']].map(([v,l])=>'<button type="button" data-lh="'+v+'" aria-pressed="'+((S.lh[sel]||'')===v)+'">'+l+'</button>').join('')+'</div></div>'
     +'<div class="field"><label for="bbtSel">基礎体温（℃）</label><div class="bbt-row"><input id="bbtSel" type="number" inputmode="decimal" step="0.01" min="34" max="42" placeholder="36.50" value="'+(S.bbt[sel]!=null?S.bbt[sel].toFixed(2):'')+'"><button type="button" class="btn" data-dact="bbt" style="flex:none">保存</button></div></div>'
     +moodCond(sel);
  }
  h+='</section>';
  return h;
}

const PAST=77, FUT=42, LW=64, MINV=10, MAXV=70;
let chartScroll=null, CW=8, visDays=40, chartCenter=null;
const ICP={
  moon:'M15.2 3.3a8.7 8.7 0 1 0 5.5 14.5A7.1 7.1 0 0 1 15.2 3.3z',
  star:'M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z',
  heart:'M12 20s-7.6-4.7-7.6-10.1A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.5C19.6 15.3 12 20 12 20z',
  egg:'M12 3c3.6 0 6.6 6.1 6.6 10.5A6.6 6.6 0 0 1 5.4 13.5C5.4 9.1 8.4 3 12 3z'

function ic(n,st,col,sz){sz=sz||14;return '<svg class="ic '+st+' k-'+col+'" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICP[n]+'"/></svg>'}
function phaseIcon(d,c,sz){
  if(S.period[d])return ic('moon','fill','period',sz);
  if(c.map[d]==='pred')return ic('moon','line','period',sz);
  if(c.map[d]==='ov')return ic('egg','egg','ovu',sz);
  if(c.map[d]==='fertile')return ic('star','line','fert',sz);

}
function heartIcon(d,c,sz){return S.timing[d]?ic('heart','fill','heart',sz):c.rec[d]?ic('heart','line','heart',sz):''}
function dayIcons(d,c,sz){return phaseIcon(d,c,sz)+heartIcon(d,c,sz)}
function iconLegend(){
  return '<div class="legend"><span>'+ic('moon','fill','period',13)+'生理</span><span>'+ic('moon','line','period',13)+'生理予定</span><span>'+ic('star','line','fert',13)+'妊娠しやすい</span><span>'+ic('egg','egg','ovu',13)+'排卵予定</span><span>'+ic('heart','line','heart',13)+'タイミング推奨</span><span>'+ic('heart','fill','heart',13)+'タイミング記録</span></div>';
}
function viewChart(){
  const c=calc(), t=today(), start=add(t,-PAST), N=PAST+FUT, days=[];
  const vw=(document.getElementById('view').clientWidth||360)-2;
  CW=(vw-LW)/visDays;
  const wide=CW>=16;
  for(let i=0;i<N;i++)days.push(add(start,i));
  let h='';
  const cell=(d,inner,extra)=>{const w=parse(d).getDay();return '<div class="gc'+(c.rec[d]?' hl':(w===0||w===6)?' wk':'')+(d===t?' tcol':'')+(extra||'')+'">'+(inner||'')+'</div>'};
  const row=(label,fn,lcls)=>{h+='<div class="gl'+(lcls?' '+lcls:'')+'">'+label+'</div>';days.forEach((d,i)=>{h+=cell(d,fn(d,i))})};
  const group=label=>{h+='<div class="gl gh">'+label+'</div>';days.forEach(d=>{h+=cell(d,'',' ghc')})};
  const bar=(test,cls)=>(d,i)=>{if(!test(d))return'';const s=i===0||!test(days[i-1]),e=i===N-1||!test(days[i+1]);return '<i class="bar '+cls+(s?' s':'')+(e?' e':'')+'"></i>'};
  row('',(d,i)=>{const p=parse(d);return (i===0||p.getDate()===1)?'<span class="gm">'+(p.getMonth()+1)+'月</span>':''},'ghead');
  h+='<div class="gl gdate-l"></div>';
  days.forEach(d=>{const p=parse(d),w=p.getDay(),n=p.getDate();
    h+=cell(d,'<button type="button" class="gd'+(w===0?' sun':w===6?' sat':'')+(d===t?' now':'')+'" data-goday="'+d+'" aria-label="'+mdj(d)+'">'+(wide?'<b>'+n+'</b><small>'+WD[w]+'</small>':'<b class="vt">'+n+'</b>')+'</button>',' gdc')});
  group('周期');
  row('生理',bar(d=>S.period[d],'b-period'));
  row('生理予定',bar(d=>c.map[d]==='pred','b-pred'));
  row('妊娠しやすい',bar(d=>!S.period[d]&&(c.map[d]==='fertile'||c.map[d]==='ov'),'b-fert'));
  row('排卵予定',d=>c.map[d]==='ov'&&!S.period[d]?ic('egg','egg','ovu'):'');
  group('タイミング');
  row('推奨',d=>c.rec[d]?ic('heart','line','heart'):'');
  row('記録',d=>S.timing[d]?ic('heart','fill','heart'):'');
  group('気分');
  row('気分',d=>{const m=MOODS.find(x=>x[0]===S.mood[d]);if(!m)return'';return wide?'<span class="gmood '+m[2]+'" title="'+m[1]+'">'+m[1][0]+'</span>':'<i class="gdot c-'+m[2]+'" title="'+m[1]+'"></i>'});
  group('体調');
  CONDS.forEach(([k,l,g])=>row('<i class="gk '+g+'"></i>'+l,d=>(S.cond[d]||[]).includes(k)?'<i class="gdot c-'+g+'"></i>':''));
  group('基礎体温');
  const W=N*CW,H=170,T=10,B=10;
  const vals=days.map(d=>S.bbt[d]).filter(v=>v!=null);
  const lo=Math.min(36.0,...vals.map(v=>Math.floor((v-.1)*4)/4)), hi=Math.max(37.0,...vals.map(v=>Math.ceil((v+.1)*4)/4));
  const y=v=>T+(hi-v)*(H-T-B)/(hi-lo), x=i=>i*CW+CW/2;
  const ns=' vector-effect="non-scaling-stroke"';
  let ax='<svg width="'+LW+'" height="'+H+'" viewBox="0 0 '+LW+' '+H+'" aria-hidden="true"><text x="4" y="10" font-size="9" fill="var(--muted)">℃</text>';
  let g='';
  days.forEach((d,i)=>{const w=parse(d).getDay();let f=null;
    if(c.rec[d])f='var(--hl)';else if(S.period[d])f='var(--period-soft)';else if(c.map[d]==='fertile'||c.map[d]==='ov')f='var(--fert-soft)';else if(w===0||w===6)f='var(--wk)';
    if(f)g+='<rect x="'+(i*CW).toFixed(2)+'" y="0" width="'+(CW+.3).toFixed(2)+'" height="'+H+'" fill="'+f+'"/>';
    if(w===0||parse(d).getDate()===1)g+='<line x1="'+(i*CW).toFixed(2)+'" x2="'+(i*CW).toFixed(2)+'" y1="0" y2="'+H+'" stroke="var(--line)"'+ns+'/>'});
  for(let v=Math.ceil(lo*4)/4;v<=hi+1e-9;v+=.25){const yy=y(v).toFixed(1),major=Math.abs(v*2-Math.round(v*2))<1e-6;
    g+='<line x1="0" x2="'+W.toFixed(1)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-dasharray="'+(major?'0':'2 3')+'"'+ns+'/>';
    if(major)ax+='<text x="'+(LW-5)+'" y="'+(+yy+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v.toFixed(2)+'</text>'}
  ax+='</svg>';
  g+='<line x1="'+x(PAST).toFixed(1)+'" x2="'+x(PAST).toFixed(1)+'" y1="0" y2="'+H+'" stroke="var(--plum)" stroke-width="1.5" opacity=".8"'+ns+'/>';
  let seg=[],prev=-9;const segs=[];
  days.forEach((d,i)=>{if(S.bbt[d]==null)return;if(i-prev>2&&seg.length){segs.push(seg);seg=[]}seg.push([x(i),y(S.bbt[d])]);prev=i});
  if(seg.length)segs.push(seg);
  const pr=Math.max(1.6,Math.min(3.5,CW*.32));
  segs.forEach(s=>{if(s.length>1)g+='<polyline fill="none" stroke="var(--plum)" stroke-width="1.6" stroke-linejoin="round"'+ns+' points="'+s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';s.forEach(p=>g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+pr.toFixed(1)+'" fill="var(--plum)"/>')});
  h+='<div class="gl gbbt-l">'+ax+'</div><div class="gbbt" style="grid-column:span '+N+'"><svg viewBox="0 0 '+W.toFixed(1)+' '+H+'" preserveAspectRatio="none" role="img" aria-label="基礎体温のグラフ">'+g+'</svg></div>';
  return '<section class="panel gpanel"><div class="section-head"><h2>グラフ</h2><div class="zoom"><button type="button" data-zoom="out" aria-label="表示期間を広げる">−</button><span id="zl" class="num">'+visDays+'日</span><button type="button" data-zoom="in" aria-label="表示期間を狭める">＋</button></div></div>'
    +'<div class="gscroll" id="gscroll"><div class="gg" id="gg" style="--cw:'+CW.toFixed(3)+'px;grid-template-columns:'+LW+'px repeat('+N+',var(--cw))">'+h+'</div></div></section>'
    +'<p class="note">2本指でピンチすると表示期間を変えられます（'+MINV+'〜'+MAXV+'日）。ピンクの列はタイミング推奨日、紫の線は今日です。日付をタップするとその日の記録が開きます。</p>';
}
function chartCenterIdx(gs){return (gs.scrollLeft+(gs.clientWidth-LW)/2)/CW}
function setVisDays(v,centerIdx){
  visDays=Math.max(MINV,Math.min(MAXV,Math.round(v)));
  chartCenter=centerIdx;render();
}
function bindChart(gs){
  const gg=document.getElementById('gg');
  if(chartCenter!=null){gs.scrollLeft=Math.max(0,chartCenter*CW-(gs.clientWidth-LW)/2);chartCenter=null}
  else gs.scrollLeft=chartScroll!=null?chartScroll:Math.max(0,PAST*CW+CW/2-(gs.clientWidth-LW)/2);
  chartScroll=gs.scrollLeft;
  gs.addEventListener('scroll',()=>{chartScroll=gs.scrollLeft},{passive:true});
  let pz=null, cw=CW;
  const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  const midX=e=>(e.touches[0].clientX+e.touches[1].clientX)/2-gs.getBoundingClientRect().left;
  const vw=gs.clientWidth-LW, minCW=vw/MAXV, maxCW=vw/MINV;
  gs.addEventListener('touchstart',e=>{if(e.touches.length===2){const mx=midX(e);pz={d:dist(e),cw:CW,mx,idx:(gs.scrollLeft+mx-LW)/CW}}},{passive:true});
  gs.addEventListener('touchmove',e=>{
    if(!pz||e.touches.length!==2)return;
    e.preventDefault();
    cw=Math.max(minCW,Math.min(maxCW,pz.cw*dist(e)/pz.d));
    gg.style.setProperty('--cw',cw+'px');
    gs.scrollLeft=pz.idx*cw-(pz.mx-LW);
    const zl=document.getElementById('zl');if(zl)zl.textContent=Math.round(vw/cw)+'日';
  },{passive:false});
  const end=e=>{if(pz&&e.touches.length<2){const ci=(gs.scrollLeft+(gs.clientWidth-LW)/2)/cw;pz=null;CW=cw;setVisDays(vw/cw,ci)}};
  gs.addEventListener('touchend',end);gs.addEventListener('touchcancel',end);
  gs.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setVisDays(visDays*(e.deltaY>0?1.1:1/1.1),chartCenterIdx(gs))},{passive:false});
  gs.addEventListener('gesturestart',e=>e.preventDefault());
}

function render(){

let toastT;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)}
function commit(msg){save();render();if(msg)toast(msg)}
function setBBT(day,val){
  if(val===''){delete S.bbt[day];return commit('体温を消去しました')}
  const n=parseFloat(val);
  if(!(n>=34&&n<=42))return toast('34〜42の範囲で入力してください');
  S.bbt[day]=Math.round(n*100)/100;commit('体温を保存しました');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const t=today();
  if(b.dataset.tab){tab=b.dataset.tab;chartScroll=null;armed=false;if(tab==='cal')sel=sel||t;render();window.scrollTo(0,0);return}
  if(b.dataset.go){tab=b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.id==='clearSample'){S=blank();sel=t;commit('サンプルを消去しました');return}
  if(b.dataset.med){const id=b.dataset.med;S.medLog[t]=S.medLog[t]||{};if(S.medLog[t][id]){delete S.medLog[t][id];commit('取り消しました')}else{S.medLog[t][id]=nowHM();commit('服用を記録しました')}return}
  if(b.dataset.mood){const d=b.dataset.mday;if(S.mood[d]===b.dataset.mood)delete S.mood[d];else S.mood[d]=b.dataset.mood;commit();return}
  if(b.dataset.cond){const d=b.dataset.cday,k=b.dataset.cond,l=S.cond[d]||[];S.cond[d]=l.includes(k)?l.filter(x=>x!==k):l.concat(k);if(!S.cond[d].length)delete S.cond[d];commit();return}
  const a=b.dataset.act;
  if(a==='period'){if(S.period[t]){delete S.period[t];commit('生理の記録を取り消しました')}else{S.period[t]=true;commit('生理を記録しました')}return}
  if(a==='timing'){if(S.timing[t])delete S.timing[t];else S.timing[t]=true;commit(S.timing[t]?'タイミングを記録しました':'取り消しました');return}
  if(a==='bbt'){setBBT(t,document.getElementById('bbtToday').value.trim());return}
  if(a==='wipe'){if(!armed){armed=true;render();return}armed=false;S=blank();commit('すべての記録を削除しました');return}
  if(a==='demo'){S=sample();commit('サンプルを表示しました');return}
  if(b.dataset.mv){let[Y,M]=vm;M+=Number(b.dataset.mv);if(M<0){M=11;Y--}if(M>11){M=0;Y++}vm=[Y,M];render();return}
  if(b.dataset.zoom){const gs=document.getElementById('gscroll');setVisDays(visDays+(b.dataset.zoom==='out'?10:-10),gs?chartCenterIdx(gs):null);return}
  if(b.dataset.goday){sel=b.dataset.goday;const p=parse(sel);vm=[p.getFullYear(),p.getMonth()];tab='cal';render();window.scrollTo(0,0);return}
  if(b.dataset.day){sel=b.dataset.day;render();return}
  const da=b.dataset.dact;
  if(da==='period'){if(S.period[sel])delete S.period[sel];else S.period[sel]=true;commit();return}
  if(da==='timing'){if(S.timing[sel])delete S.timing[sel];else S.timing[sel]=true;commit();return}
  if(da==='bbt'){setBBT(sel,document.getElementById('bbtSel').value.trim());return}
  if(b.dataset.lh!==undefined){if(b.dataset.lh)S.lh[sel]=b.dataset.lh;else delete S.lh[sel];commit();return}
  if(b.dataset.del){const id=b.dataset.del;S.meds=S.meds.filter(m=>m.id!==id);Object.values(S.medLog).forEach(l=>delete l[id]);commit('削除しました');return}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addMed')return;e.preventDefault();
  const n=document.getElementById('medName').value.trim(), tm=document.getElementById('medTime').value;
  if(!n||!tm)return toast('名前と時刻を入力してください');
  S.meds.push({id:'m'+Date.now().toString(36),name:n,time:tm});commit('「'+n+'」を追加しました');
});
document.addEventListener('change',e=>{
  const map={sCycle:['cycle',18,50],sPeriod:['period',2,10],sLuteal:['luteal',10,16]};
  const m=map[e.target.id];if(!m)return;
  const v=Math.round(Number(e.target.value));
  if(!(v>=m[1]&&v<=m[2])){toast(m[1]+'〜'+m[2]+'の範囲で入力してください');render();return}
  S.settings[m[0]]=v;commit('設定を保存しました');
});

// 開いている間の時刻チェック
let lastDay=today(), alerted={};
setInterval(()=>{
  const t=today(), hm=nowHM();
  if(t!==lastDay){lastDay=t;alerted={};render();return}
  S.meds.forEach(m=>{const k=t+m.id;if(!alerted[k]&&hm===m.time&&!(S.medLog[t]||{})[m.id]){alerted[k]=1;toast(m.name+' を飲む時間です');render()}});
  if(tab==='today'||tab==='meds'){const ae=document.activeElement;if(!ae||ae.tagName!=='INPUT')render()}
},30000);

window.addEventListener('resize',()=>{if(tab==='chart')render()});
render();
})();
</script>
